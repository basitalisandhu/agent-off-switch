name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: "Test (offline: synthetic exports only)"
        run: python -m pytest -q -rs
      - name: "Smoke run: aos review examples/demo-tenant"
        shell: bash
        run: |
          aos --version
          aos review examples/demo-tenant --as-of 2026-10-09 --fail-on none > review.md
          grep -q "4 agent identities nobody owns" review.md
          aos review examples/demo-tenant --as-of 2026-10-09 --format sarif --fail-on none --out aos.sarif
          python -c "import json; d = json.load(open('aos.sarif', encoding='utf-8')); assert d['version'] == '2.1.0' and d['runs'][0]['results']"
          aos inventory examples/demo-tenant --as-of 2026-10-09 --format csv > inventory.csv
          aos off examples/demo-tenant mail-triage-agent --as-of 2026-10-09 > off.md
          set +e
          aos drift examples/drift/baseline.json examples/demo-tenant --as-of 2026-10-09 --accept examples/drift/accepted.txt > drift.md
          code=$?
          set -e
          test "$code" = "1"

  quickstart:
    name: README quick start on a fresh install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Clone, install in a new venv and run the demo exactly as the README does
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/newcomer"
          git clone --quiet "$GITHUB_WORKSPACE" "$work/agent-off-switch"
          cd "$work/agent-off-switch"
          python3 -m venv .venv && . .venv/bin/activate && pip install --quiet .
          aos review examples/demo-tenant --as-of 2026-10-09 > review.md || test $? = 1
          grep -qx "## 4 agent identities nobody owns" review.md
          grep -q "15 findings (8 error)" review.md
          aos off examples/demo-tenant aws-role:coding-agent-runner --as-of 2026-10-09 > off.md
          grep -q "^# Off-switch runbook: coding-agent-runner" off.md
          grep -q "Every credential and grant in the exports is named by a step." off.md
          set +e
          aos drift examples/drift/baseline.json examples/demo-tenant --as-of 2026-10-09 --accept examples/drift/accepted.txt > drift.md
          code=$?
          set -e
          test "$code" = "1"
          grep -q "4 changes, 3 not reviewed" drift.md

  container-build:
    name: Build the container image and run it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image and review the demo tenant inside it
        run: |
          docker build --build-arg VERSION=ci -t agent-off-switch:ci .
          docker run --rm agent-off-switch:ci --help > help.txt && grep "^usage: aos" help.txt
          test "$(docker run --rm --entrypoint id agent-off-switch:ci -u)" = "1000"
          docker run --rm -v "$PWD/examples:/work/examples:ro" agent-off-switch:ci review examples/demo-tenant --as-of 2026-10-09 --fail-on none

  action-self-test:
    name: "Action self-test (uses: ./)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the action on the demo tenant (no upload, fail-on none)
        id: review
        uses: ./
        with:
          exports: examples/demo-tenant
          as-of: "2026-10-09"
          fail-on: none
          upload-sarif: "false"
      - name: Check the review outputs
        env:
          REVIEW: ${{ steps.review.outputs.review-exit-code }}
          SARIF: ${{ steps.review.outputs.sarif-file }}
        run: |
          test "$REVIEW" = "0"
          python3 -c "import json, sys; d = json.load(open(sys.argv[1])); assert d['version'] == '2.1.0' and d['runs'][0]['results']" "$SARIF"
      - name: Run the action with the drift baseline (must fail on unreviewed changes)
        id: drift
        uses: ./
        with:
          exports: examples/demo-tenant
          as-of: "2026-10-09"
          fail-on: none
          baseline: examples/drift/baseline.json
          accept: examples/drift/accepted.txt
          upload-sarif: "false"
          sarif-file: aos-drift.sarif
        continue-on-error: true
      - name: Check that the drift gate failed
        env:
          OUTCOME: ${{ steps.drift.outcome }}
        run: test "$OUTCOME" = "failure"
