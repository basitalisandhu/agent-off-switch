[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-off-switch"
version = "0.1.1"
description = "Find every AI agent identity in Microsoft 365, AWS and GitHub from saved exports, see what it can reach, and print the runbook to switch it off."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Basit Ali" }]
keywords = [
  "ai-agents",
  "agent-security",
  "non-human-identity",
  "entra-id",
  "microsoft-365",
  "aws-iam",
  "github-apps",
  "access-review",
  "kill-switch",
  "sarif",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
# Standard library only at run time.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
aos = "agent_off_switch.cli:main"

[project.urls]
Homepage = "https://github.com/basitalisandhu/agent-off-switch"
Repository = "https://github.com/basitalisandhu/agent-off-switch"
Issues = "https://github.com/basitalisandhu/agent-off-switch/issues"
Changelog = "https://github.com/basitalisandhu/agent-off-switch/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_off_switch"]

[tool.hatch.build.targets.sdist]
include = [
  "src/agent_off_switch/**",
  "examples/**",
  "docs/**",
  "tests/**",
  "action.yml",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pyproject.toml",
]
exclude = ["docs/demo.gif"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
